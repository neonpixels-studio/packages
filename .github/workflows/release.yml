# Releases @neon-pixels/* packages. Changesets drives two phases from pushes to
# main:
#   version: pending changesets -> open or update the "Version Packages" PR
#   publish: that PR was merged -> test, build, pack, check, publish
#
# Publishing uses npm trusted publishing (OIDC). There is no npm token. npm
# matches the trusted publisher against this exact filename, so the publish
# step must stay in this file, never in a reusable workflow.
name: Release

on:
  push:
    branches: [main]

# Each job declares only what it needs.
permissions: {}

# Concurrency is per job, not per workflow. A workflow-level group keeps one
# pending run, so a later push could displace a queued run of the publish phase.
# Here each phase queues behind itself, and select-mode (read-only) always runs.
# cancel-in-progress is false everywhere, so nothing is cancelled mid-publish.

env:
  HUSKY: 0
  # The release branch changesets/action/version pushes to.
  VERSION_BRANCH: changeset-release/main

jobs:
  select-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    concurrency:
      group: release-version
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch
      pull-requests: write # open or update the Version Packages PR
      actions: write # dispatch ci.yml on the release branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Version packages
        id: version
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm changeset version
      # A PR opened with GITHUB_TOKEN does not trigger pull_request workflows,
      # so start CI on the release branch by hand. No personal access token.
      - name: Run CI on the Version Packages branch
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci
      - run: pnpm build
      - name: Pack publishable packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
      # The publish job ships exactly these tarballs, so check them here.
      - name: Download the packed tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/packed
      - name: Check the tarballs
        run: node scripts/release/check-tarballs.ts "$RUNNER_TEMP/packed" --require-tarballs

  publish:
    needs: pack
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push tags and create GitHub releases
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # No build here: this job holds the OIDC token, so it installs the
      # Changesets CLI without lifecycle scripts and ships only the tarballs
      # the pack job built and checked.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the packed tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/packed
      - name: Publish packages
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: node scripts/release/publish-packed.ts ${{ runner.temp }}/packed
          create-github-releases: true
        env:
          # Fail instead of silently publishing without provenance.
          PNPM_CONFIG_PROVENANCE: "true"
