# Reusable scheduled production deploy for a Netlify site, in one call. Call it
# from a job with `uses:` (see README.md); the calling workflow owns the
# schedule, so each site keeps its own cadence. A site that must run its own
# job between the decision and the deploy (database migrations, for example)
# calls production-deploy-decide.yml and production-deploy-trigger.yml itself.
#
# This workflow is those two called back to back, so the decide, trigger,
# verify, and failure-issue logic exists once. Each call below is pinned to a
# full commit SHA of this repository: a nested reusable workflow cannot use a
# relative path, because that resolves in the caller's repository. Bump both
# pins together when the two workflows change.
name: Production deploy

on:
  workflow_call:
    inputs:
      scripts-version:
        description: "Exact @neon-pixels/scripts version to run the deploy bins from, such as 0.3.0."
        type: string
        required: true
      node-version-file:
        description: "File that names the Node version (for example .nvmrc), relative to the repository root."
        type: string
        default: .nvmrc
    secrets:
      NETLIFY_BUILD_HOOK_URL:
        description: "Netlify build hook URL for branch main."
        required: true
      NETLIFY_AUTH_TOKEN:
        description: "Netlify personal access token that can read the site's deploys."
        required: true
      NETLIFY_SITE_ID:
        description: "Netlify site id (API id) of the production site."
        required: true

permissions:
  contents: read

jobs:
  decide:
    uses: neonpixels-studio/packages/.github/workflows/production-deploy-decide.yml@883685addd20ddd458f933df2e6900984d183441 # 2026-11-23 split deploy
    permissions:
      contents: read
      actions: read
    with:
      scripts-version: ${{ inputs.scripts-version }}
      node-version-file: ${{ inputs.node-version-file }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy:
    needs: decide
    # A decide job that failed still runs the deploy call, which files the
    # failure issue instead of leaving a red run nobody reads. A skipped decide
    # job (a ref other than main) runs it too; the trigger workflow does
    # nothing there. A commit that is already live (skip == 'true') deploys nothing.
    if: ${{ !cancelled() && (needs.decide.result != 'success' || needs.decide.outputs.skip == 'false') }}
    uses: neonpixels-studio/packages/.github/workflows/production-deploy-trigger.yml@883685addd20ddd458f933df2e6900984d183441 # 2026-11-23 split deploy
    permissions:
      contents: read
      issues: write
    with:
      scripts-version: ${{ inputs.scripts-version }}
      node-version-file: ${{ inputs.node-version-file }}
      expected-sha: ${{ needs.decide.outputs.sha }}
      pre-deploy-result: ${{ needs.decide.result }}
    secrets:
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
