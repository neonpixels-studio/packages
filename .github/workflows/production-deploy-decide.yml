# First half of the split production deploy: decides whether main needs a
# deploy and, optionally, that its CI passed. It deploys nothing. A caller runs
# its own job (for example database migrations) after this one and before
# production-deploy-trigger.yml, which does the deploy (see README.md).
#
# Outputs `skip` ("true" or "false") and `sha` (the commit that was checked).
# From any ref other than main the job does not run and both outputs are empty,
# so a caller condition of `skip == 'false'` deploys nothing.
#
# A manual run (the caller's `workflow_dispatch`) always deploys: np-should-deploy
# reads GITHUB_EVENT_NAME, which inside a reusable workflow holds the caller's
# event, so no input is needed. The require-ci-workflow check still runs then.
# Needs a scripts-version that includes this change; older versions still skip.
name: Production deploy decide

on:
  workflow_call:
    inputs:
      scripts-version:
        description: "Exact @neon-pixels/scripts version to run the deploy bins from, such as 0.4.0."
        type: string
        required: true
      node-version-file:
        description: "File that names the Node version (for example .nvmrc), relative to the repository root."
        type: string
        default: .nvmrc
      require-ci-workflow:
        description: "Bare file name of a workflow (for example ci.yml) whose newest push run for this commit must have succeeded. Leave empty to skip the check. Needs actions: read on the calling job."
        type: string
        default: ""
    secrets:
      NETLIFY_AUTH_TOKEN:
        description: "Netlify personal access token that can read the site's deploys."
        required: true
      NETLIFY_SITE_ID:
        description: "Netlify site id (API id) of the production site."
        required: true
    outputs:
      skip:
        description: "true when this commit is already live, otherwise false. Empty when the job did not run."
        value: ${{ jobs.decide.outputs.skip }}
      sha:
        description: "The commit that was checked. Empty when the job did not run."
        value: ${{ jobs.decide.outputs.sha }}

permissions:
  contents: read

jobs:
  decide:
    # The hook always builds main, so a run from another ref must not deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only the optional CI lookup reads workflow runs.
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      sha: ${{ steps.sha.outputs.sha }}
    env:
      SCRIPTS_VERSION: ${{ inputs.scripts-version }}
    steps:
      - name: Require secrets and inputs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          REQUIRE_CI_WORKFLOW: ${{ inputs.require-ci-workflow }}
        run: |
          set -euo pipefail
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The ${name} secret is not set. Pass it from the calling workflow with an explicit secrets: block."
              exit 1
            fi
          done
          if ! [[ "${SCRIPTS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::scripts-version must be an exact version such as 0.4.0"
            exit 1
          fi
          # Used in an API path, so only a bare workflow file name is allowed.
          if [ -n "${REQUIRE_CI_WORKFLOW}" ] && ! [[ "${REQUIRE_CI_WORKFLOW}" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]]; then
            echo "::error::require-ci-workflow must be a bare workflow file name ending in .yml or .yaml, such as ci.yml"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      # Installed outside the workspace so the caller's own package.json and
      # lockfile are never read or changed, and none of its scripts run.
      - name: Install the deploy bins
        run: |
          set -euo pipefail
          npm install --prefix "${RUNNER_TEMP}/np-scripts" --ignore-scripts --no-audit --no-fund --no-save "@neon-pixels/scripts@${SCRIPTS_VERSION}"
          echo "${RUNNER_TEMP}/np-scripts/node_modules/.bin" >> "${GITHUB_PATH}"
      # Compares the commit to the last live production deploy rather than a
      # time window, so a late cron start or an earlier failed deploy cannot
      # strand a commit. Every lookup problem deploys instead of skipping.
      - name: Skip when this commit is already live
        id: decide
        env:
          CURRENT_SHA: ${{ github.sha }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: np-should-deploy
      - name: Record the checked commit
        id: sha
        run: echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      # Only a commit that is about to deploy needs a green CI run. Anything
      # but a finished, successful push run (missing, in progress, API error)
      # fails, so a deploy never ships an unverified commit.
      - name: Require a successful CI run for this commit
        if: inputs.require-ci-workflow != '' && steps.decide.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_CI_WORKFLOW: ${{ inputs.require-ci-workflow }}
        run: |
          set -euo pipefail
          lookup_error="${RUNNER_TEMP}/np-ci-lookup-error"
          if ! conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${REQUIRE_CI_WORKFLOW}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=1" --jq '.workflow_runs[0] | if . == null then "no run found" elif .conclusion == null then "in progress (" + .status + ")" else .conclusion end' 2> "${lookup_error}"); then
            echo "::error::Could not look up the ${REQUIRE_CI_WORKFLOW} run for ${GITHUB_SHA}. The calling job needs permissions: actions: read. $(tr '\n' ' ' < "${lookup_error}")"
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "::error::The newest push run of ${REQUIRE_CI_WORKFLOW} for ${GITHUB_SHA} is ${conclusion}, not success. Nothing was deployed."
            exit 1
          fi
