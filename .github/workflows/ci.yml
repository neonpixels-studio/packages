name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow dispatches CI on the "Version Packages" branch.
  # Pull requests opened with GITHUB_TOKEN do not trigger pull_request runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pnpm/action-setup installs the exact pnpm pinned in `packageManager`
      # (Node 25+ no longer ships Corepack).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci
      - run: pnpm build
      - name: Check actions are pinned to commit SHAs
        run: pnpm exec np-check-action-pinning

  # Fails a pull request that changes a published package without a changeset.
  # Skipped on the release branch, whose commit consumes the changesets.
  changeset-check:
    if: github.event_name == 'pull_request' && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/release/check-changeset.ts "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

  # Packs every package exactly as the release would, checks the tarballs, and
  # runs `npm publish --dry-run` on each one not already on npm (npm refuses to
  # publish over a released version, so unchanged packages are skipped and only
  # new versions, such as the Version Packages PR's, are dry-run). Nothing is
  # published.
  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm build
      - name: Pack every package
        run: pnpm --filter "./packages/*" exec pnpm pack --pack-destination "$RUNNER_TEMP/dry-run"
      - name: Check the tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/dry-run"
          node scripts/release/check-tarballs.ts "$RUNNER_TEMP/dry-run" --require-tarballs
      - name: Publish dry run
        run: node scripts/release/dry-run-packed.ts "$RUNNER_TEMP/dry-run"

  # Both call this repo's own reusable workflows, which is the test that they
  # work. Consumers call them by commit SHA (see README.md); this repo calls them
  # by path so a pull request exercises its own workflow edits. The gate code
  # itself is covered by the scripts package tests.
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
    permissions:
      contents: read

  dependency-audit:
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read
    with:
      package-manager: pnpm
      node-version-file: .nvmrc
      # @todo Bump after each @neon-pixels/scripts release (Changesets does not touch this line).
      scripts-version: 0.2.0
