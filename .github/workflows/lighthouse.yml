# Reusable Lighthouse CI run. Call it from a job with `uses:` (see README.md).
#
# Installs and builds the caller's project, then runs Lighthouse CI against the
# caller's own config. The thresholds, URLs, and how the build is served all
# live in that config file; this workflow only runs it and reports. A failing
# run on the default branch files one issue per site, and a passing run closes
# the open ones (np-report-lighthouse-failure).
name: Lighthouse

on:
  workflow_call:
    inputs:
      package-manager:
        description: "Package manager the project uses: npm or pnpm."
        type: string
        required: true
      node-version-file:
        description: "File that names the Node version (for example .nvmrc), relative to the repository root."
        type: string
        default: .nvmrc
      build-script:
        description: "package.json script that builds the site before it is audited."
        type: string
        default: build
      config-path:
        description: "Lighthouse CI config file in the caller's repository."
        type: string
        default: ./lighthouserc.cjs
      scripts-version:
        description: "Exact @neon-pixels/scripts version to run np-report-lighthouse-failure from, such as 0.3.0."
        type: string
        required: true

permissions:
  contents: read

env:
  ASSERTION_ARTIFACT: np-lighthouse-assertion-results

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build-outcome: ${{ steps.build.outcome }}
    env:
      PACKAGE_MANAGER: ${{ inputs.package-manager }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      SCRIPTS_VERSION: ${{ inputs.scripts-version }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "${PACKAGE_MANAGER}" in
            npm | pnpm) ;;
            *)
              echo "::error::package-manager must be npm or pnpm"
              exit 1
              ;;
          esac
          if ! [[ "${BUILD_SCRIPT}" =~ ^[A-Za-z0-9:_-]+$ ]]; then
            echo "::error::build-script must be a package.json script name such as build"
            exit 1
          fi
          if ! [[ "${SCRIPTS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::scripts-version must be an exact version such as 0.3.0"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm/action-setup installs the exact pnpm pinned in `packageManager`.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ "${PACKAGE_MANAGER}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
        env:
          HUSKY: 0
      - name: Build
        id: build
        run: |
          set -euo pipefail
          "${PACKAGE_MANAGER}" run "${BUILD_SCRIPT}"
      # Third-party action pinned to a commit SHA. Thresholds come from the
      # caller's config file, never from this workflow.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ${{ inputs.config-path }}
          uploadArtifacts: true
      # The report job needs the assertion results, and a job cannot read
      # another job's files, so hand them over as an artifact.
      - name: Upload the assertion results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSERTION_ARTIFACT }}
          path: .lighthouseci/assertion-results.json
          if-no-files-found: ignore
          retention-days: 7

  # Separate job so `issues: write` stays out of the job that builds the
  # caller's code. Pull requests never file issues.
  report:
    needs: audit
    if: always() && (needs.audit.result == 'success' || needs.audit.result == 'failure') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_RESULT: ${{ needs.audit.result }}
      BUILD_OUTCOME: ${{ needs.audit.outputs.build-outcome }}
      SCRIPTS_VERSION: ${{ inputs.scripts-version }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: ${{ env.ASSERTION_ARTIFACT }}
          path: .lighthouseci
      - name: Install the report bin
        run: |
          set -euo pipefail
          npm install --prefix "${RUNNER_TEMP}/np-scripts" --ignore-scripts --no-audit --no-fund --no-save "@neon-pixels/scripts@${SCRIPTS_VERSION}"
          echo "${RUNNER_TEMP}/np-scripts/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Close or file the Lighthouse regression issue
        run: |
          set -euo pipefail
          export RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${AUDIT_RESULT}" = "success" ]; then
            np-report-lighthouse-failure --passed
            exit 0
          fi
          # GITHUB_WORKFLOW_REF names the calling workflow, whose filename is
          # what the report uses to link the commits since its last passing run.
          workflow_file="${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}"/.github/workflows/}"
          workflow_file="${workflow_file%%@*}"
          np-report-lighthouse-failure --workflow "${workflow_file}"
