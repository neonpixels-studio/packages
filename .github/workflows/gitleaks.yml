# Reusable secret scan. Call it from a job with `uses:` (see README.md).
#
# Scans the pull request commit range, or the full history on any other event,
# with the caller's `.gitleaks.toml`. Needs no secrets and no inputs.
name: Gitleaks

on:
  workflow_call:

permissions:
  contents: read

env:
  # Bump GITLEAKS_VERSION and GITLEAKS_SHA256 together. The SHA is the linux x64
  # tarball digest from the release's checksums.txt, pinned here so the trusted
  # artifact is auditable in the diff.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the gitleaks config
        run: |
          if [ ! -f .gitleaks.toml ]; then
            echo "::error::.gitleaks.toml is required in the repository root"
            exit 1
          fi
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors "${base}/${archive}" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}" gitleaks
          gitleaks version
      - name: Scan pull request commit range for secrets
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --exit-code 1 \
            --log-opts "${BASE_SHA}..${HEAD_SHA}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Scan full history for secrets
        if: github.event_name != 'pull_request'
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --exit-code 1
