version: 2
# No target-branch override: updates go to the default branch, which also keeps
# Dependabot security update PRs enabled.
updates:
  - package-ecosystem: npm
    directory: "/"
    assignees:
      - grimicorn
    schedule:
      interval: weekly
    groups:
      # Listed first on purpose: Dependabot assigns a dependency to the first
      # group that matches it, so the shared packages must be claimed before
      # `minor-and-patch` can swallow their minor and patch bumps.
      neon-pixels:
        patterns:
          - "@neon-pixels/*"
      # Collapse all minor and patch bumps into a single PR to reduce churn.
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    assignees:
      - grimicorn
    schedule:
      interval: weekly
    groups:
      # Keep the SHA-pinned workflow actions current in a single PR.
      actions:
        update-types:
          - minor
          - patch
